name: Update Google Scholar data

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        if: env.GOOGLE_SCHOLAR_ID != ''
        run: python -m pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation data
        if: env.GOOGLE_SCHOLAR_ID != ''
        working-directory: google_scholar_crawler
        run: python main.py

      - name: Publish citation data branch
        if: env.GOOGLE_SCHOLAR_ID != ''
        working-directory: google_scholar_crawler/results
        shell: bash
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git commit -m "Update citation data"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Explain skipped update
        if: env.GOOGLE_SCHOLAR_ID == ''
        run: echo "GOOGLE_SCHOLAR_ID is not configured; skipping the optional citation update."
